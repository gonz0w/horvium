name: Browser qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  firefox:
    name: firefox-linux-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Browser system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64
      - name: Verify development SDK and browser artifacts
        run: |
          python3 tools/bootstrap-go.py
          python3 tools/bootstrap-browser.py
          .tools/browser/firefox/firefox/firefox --version
          .tools/browser/geckodriver/geckodriver --version
      - name: Actual Firefox full-page and progressive flows
        run: python3 tools/browser-qualification.py --browser firefox --output .tools/browser-results.json
