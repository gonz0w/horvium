name: BSD performance qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  performance:
    name: performance-freebsd-${{ matrix.release }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified disposable VM
        env:
          PERF_RELEASE: ${{ matrix.release }}
          PERF_DIRECTORY: ${{ runner.temp }}/horvium-performance-vm
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf zstd
          sudo chmod 666 /dev/kvm
          python3 --version
          qemu-system-x86_64 --version
          python3 tools/prepare-performance-vm.py "$PERF_RELEASE" "$PERF_DIRECTORY"
      - name: Native fixtures and measured budgets
        env:
          PERF_RELEASE: ${{ matrix.release }}
          PERF_DIRECTORY: ${{ runner.temp }}/horvium-performance-vm
        run: |
          set -o pipefail
          python3 "$PERF_DIRECTORY/anyvm.py" --os freebsd --release "$PERF_RELEASE" --builder 2.2.8 \
            --cpu 2 --cpu-type qemu64 --mem 6144 --snapshot --vnc off --remote-vnc no \
            --data-dir "$PERF_DIRECTORY" --sync tar --sync-exclude .git --sync-exclude .tools \
            -v "$GITHUB_WORKSPACE:/root/work" -- \
            'cd /root/work && pkg install -y python314 && env HORVIUM_NATIVE_VM=1 sh tools/bsd-native-discovery.sh && env HORVIUM_NATIVE_VM=1 HORVIUM_PERF_VM=1 sh tools/bsd-performance.sh' 2>&1 | tee "$PERF_DIRECTORY/qualification.log"
          python3 tools/check-performance-evidence.py "$PERF_DIRECTORY/qualification.log"
      - name: Verify unchanged base image and runtime
        if: always()
        env:
          PERF_RELEASE: ${{ matrix.release }}
          PERF_DIRECTORY: ${{ runner.temp }}/horvium-performance-vm
        run: python3 tools/prepare-performance-vm.py "$PERF_RELEASE" "$PERF_DIRECTORY" --verify
