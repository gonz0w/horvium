name: BSD native validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select one suite; full is an explicit milestone/release run
        type: choice
        default: none
        options: [none, discovery, properties, continuity, performance, browser, foundation, research, full]

permissions:
  contents: read

jobs:
  discovery:
    if: inputs.suite == 'discovery' || inputs.suite == 'full'
    name: product-freebsd-${{ matrix.release }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual product discovery, helper, cache and admin in disposable QEMU
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: ${{ matrix.release }}
          arch: amd64
          copyback: false
          prepare: pkg install -y python314 ${{ inputs.suite == 'full' && 'samba423' || '' }}
          run: |
            env HORVIUM_NATIVE_VM=1 sh tools/bsd-native-discovery.sh
            if [ "${{ inputs.suite == 'full' }}" = true ]; then
              env HORVIUM_NATIVE_VM=1 HORVIUM_CONTINUITY_VM=1 sh tools/bsd-continuity.sh
            fi

  freebsd:
    if: inputs.suite == 'foundation' || inputs.suite == 'full'
    name: freebsd-foundation-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native FreeBSD shell checks
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: '15.1'
          arch: amd64
          copyback: false
          prepare: pkg install -y git
          run: sh tools/bsd-foundation-smoke.sh FreeBSD

  research:
    if: inputs.suite == 'research' || inputs.suite == 'full'
    name: research-freebsd-${{ matrix.release }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disposable QEMU discovery and credential experiment
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: ${{ matrix.release }}
          arch: amd64
          copyback: false
          run: env HORVIUM_RESEARCH_VM=1 sh tools/research/m1-native.sh

  performance:
    if: inputs.suite == 'performance' || inputs.suite == 'full'
    uses: ./.github/workflows/bsd-performance.yml

  browser:
    if: inputs.suite == 'browser' || inputs.suite == 'full'
    uses: ./.github/workflows/browser-qualification.yml

  properties:
    if: inputs.suite == 'properties' || inputs.suite == 'full'
    uses: ./.github/workflows/bsd-properties.yml

  continuity:
    if: inputs.suite == 'continuity'
    uses: ./.github/workflows/bsd-continuity.yml
