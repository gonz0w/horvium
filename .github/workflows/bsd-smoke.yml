name: BSD native validation

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Run synthetic console qualification in actual Linux Firefox
        type: boolean
        default: false
      continuity:
        description: Run fixture-only independent SMB/NFS continuity
        type: boolean
        default: false
      performance:
        description: Run the measured application budgets in separate pinned VMs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discovery:
    name: product-freebsd-${{ matrix.release }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual product discovery, helper, cache and admin in disposable QEMU
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: ${{ matrix.release }}
          arch: amd64
          copyback: false
          prepare: pkg install -y python314 ${{ inputs.continuity && 'samba423' || '' }}
          run: |
            env HORVIUM_NATIVE_VM=1 sh tools/bsd-native-discovery.sh
            if [ "${{ inputs.continuity }}" = true ]; then
              env HORVIUM_NATIVE_VM=1 HORVIUM_CONTINUITY_VM=1 sh tools/bsd-continuity.sh
            fi

  freebsd:
    name: freebsd-foundation-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native FreeBSD shell checks
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: '15.1'
          arch: amd64
          copyback: false
          prepare: pkg install -y git
          run: sh tools/bsd-foundation-smoke.sh FreeBSD

  research:
    name: research-freebsd-${{ matrix.release }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['15.1', '14.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disposable QEMU discovery and credential experiment
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: ${{ matrix.release }}
          arch: amd64
          copyback: false
          run: env HORVIUM_RESEARCH_VM=1 sh tools/research/m1-native.sh

  performance:
    if: inputs.performance
    uses: ./.github/workflows/bsd-performance.yml

  browser:
    if: inputs.browser
    uses: ./.github/workflows/browser-qualification.yml

  properties:
    uses: ./.github/workflows/bsd-properties.yml
