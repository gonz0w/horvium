name: Work item
description: Propose a bounded Horvium outcome or acceptance gate.
title: "[Work]: "
labels: ["status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Follow the pinned central delivery agreement linked in AGENTS.md and the local GitHub workflow; triage adds type, priority, milestone, native parent/blockers and Project fields. Never include keys, host inventories or customer data; use SECURITY.md for exploitable vulnerabilities.
  - type: dropdown
    id: kind
    attributes:
      label: Work kind
      options: [Feature, Research, Acceptance, Tracking, Documentation]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 1. Outcome
      description: Concrete user/dependent outcome and named MVP/release in this repository; research includes question and time box.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 2. Acceptance
      description: Observable checklist criteria and evidence required to close this bounded issue.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 3. Design and requirements
      description: Stable requirement IDs and authoritative PRD/EDD/Test Design, contract and ADR links; identify missing approvals.
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: 4. Relationships
      description: Existing M0–M7 phase, parent gate and repository-qualified blockers; triage also sets native relationships.
  - type: textarea
    id: evidence
    attributes:
      label: 5. Existing evidence
      description: Merged PRs and candidate-specific receipts, actual native/client/browser profiles, failures, skips and teardown. Planned tests are not passes.
  - type: textarea
    id: scope
    attributes:
      label: 6. Tracking scope
      description: Scope, non-goals, owner, priority, limitations and remaining work. Keep internal helpers within the coherent outcome.
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Ready, Done and proportional validation
      description: >-
        Apply central DoR/DoD to this story: resolved and unresolved dependencies/decisions,
        observable tests and required native/security gates, evidence and rollout/rollback.
        State owner, authority/holds and next action. A source merge alone cannot close native acceptance.
    validations:
      required: true
